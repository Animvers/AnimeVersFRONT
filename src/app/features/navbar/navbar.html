<header>
  <nav class="navbar">
    <div class="nav-brand">
      <img class="logo" src="Logo.png" alt="LOGO">
      <div class="brand-text"><h1> AnimVers </h1></div>
    </div>

    <div class="nav-links">
      <a routerLink="/" ><b>Accueil</b></a>
    </div>

    <div class="nav-links">
      @if(authService.currentUserSelect(); as user) {

        @if(user.role && user.role.includes('ROLE_ADMIN')) {
          <a routerLink="/admin" routerLinkActive="active"><b> Admin </b></a>
        } @else {
          <a routerLink="/user" routerLinkActive="active"><b> {{user.pseudo}}</b></a>
        }

        <a (click)="app.logOut()" style="cursor:pointer"><b> Déconnexion</b></a>

      } @else {
        <a routerLink="/login"><b>Connexion</b></a>
        <a routerLink="/register"><b>Inscription</b></a>
      }
    </div>


  </nav>
</header>
